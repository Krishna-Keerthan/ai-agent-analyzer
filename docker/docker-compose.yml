services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_analytics_db
    environment:
      POSTGRES_DB: agent_analytics
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d agent_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: agent_analytics_pooler
    environment:
      DB_USER: app_admin
      DB_PASSWORD: admin_password
      DB_HOST: postgres
      DB_NAME: agent_analytics
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 150
      RESERVE_POOL_SIZE: 25
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: